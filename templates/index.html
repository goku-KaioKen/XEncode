<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XEncode - XSS and SSRF Payload Encoder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f9f9f9; color: #333; }
        h1 { text-align: center; margin-bottom: 20px; }
        select { margin-bottom: 20px; padding: 10px; font-size: 16px; }
        textarea {
            width: 100%; padding: 15px; font-size: 16px; margin-bottom: 20px;
            border-radius: 8px; border: 1px solid #ccc; background: #fff; resize: vertical;
            max-height: 200px; overflow-y: auto;
        }
        pre {
            width: 100%; padding: 15px; font-size: 14px; margin-bottom: 20px;
            border-radius: 8px; border: 1px solid #ccc; background: #f4f4f4;
            white-space: pre-wrap; word-break: break-word; overflow-x: auto;
        }
        button {
            padding: 10px 20px; margin: 10px 0; font-size: 16px;
            border: none; border-radius: 5px; background-color: #007BFF;
            color: white; cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        .result-block { margin-bottom: 30px; }
        .result-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 5px;
        }
        .copy-btn {
            background-color: #28a745; font-size: 14px; padding: 6px 12px;
        }
        .copy-btn:hover { background-color: #1e7e34; }
        .loading { font-style: italic; color: gray; }
    </style>
</head>
<body>

<h1>XEncode</h1>

<select id="modeSelector" onchange="encodePayload()">
  <option value="xss">XSS Mode</option>
  <option value="ssrf">SSRF Obfuscation Mode</option>
</select>

<textarea id="payload" placeholder="Paste your payload here..." rows="5"></textarea>

<hr>

<div id="results"></div>

<div style="text-align: center;">
    <button type="button" onclick="copyAll()">Copy ALL Encodings</button>
</div>

<script>
    let timer = null;

    function encodePayload() {
        const payload = document.getElementById('payload').value;
        const mode = document.getElementById('modeSelector').value;

        fetch('/encode', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'payload=' + encodeURIComponent(payload) + '&mode=' + encodeURIComponent(mode)
        })
        .then(response => response.json())
        .then(data => {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            for (const [name, value] of Object.entries(data)) {
                const block = document.createElement('div');
                block.className = 'result-block';

                const header = document.createElement('div');
                header.className = 'result-header';

                const title = document.createElement('h3');
                title.textContent = name;

                const copyBtn = document.createElement('button');
                copyBtn.textContent = 'Copy';
                copyBtn.className = 'copy-btn';
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(value).then(() => alert('Copied!'));
                };

                const pre = document.createElement('pre');
                pre.id = name;
                pre.className = 'encoded-text';
                pre.textContent = value; // ✅ SAFE rendering

                header.appendChild(title);
                header.appendChild(copyBtn);
                block.appendChild(header);
                block.appendChild(pre);
                resultsDiv.appendChild(block);
            }
        })
        .catch(() => {
            document.getElementById('results').innerHTML = '<p class="loading">Error encoding</p>';
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        const textarea = document.getElementById('payload');
        textarea.addEventListener('input', function() {
            clearTimeout(timer);
            timer = setTimeout(encodePayload, 300);
        });
        encodePayload();
    });

    function copyText(id) {
        const text = document.getElementById(id).innerText;
        navigator.clipboard.writeText(text).then(() => alert('Copied!'));
    }

    function copyAll() {
        const elements = document.querySelectorAll('.encoded-text');
        let combined = '';
        elements.forEach(el => combined += el.innerText + '\n');
        navigator.clipboard.writeText(combined).then(() => alert('All Encoded Results Copied!'));
    }
</script>

</body>
</html>
