<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XEncode - XSS and SSRF Payload Encoder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f9f9f9; color: #333; }
        h1 { text-align: center; margin-bottom: 20px; }
        select { margin-bottom: 20px; padding: 10px; font-size: 16px; }
        textarea {
            width: 100%; padding: 15px; font-size: 16px; margin-bottom: 20px;
            border-radius: 8px; border: 1px solid #ccc; background: #fff; resize: vertical;
            max-height: 200px; overflow-y: auto;
        }
        pre {
            width: 100%; padding: 15px; font-size: 14px; margin-bottom: 5px;
            border-radius: 8px; border: 1px solid #ccc; background: #f4f4f4;
            white-space: pre-wrap; word-break: break-word; overflow-x: auto;
        }
        button {
            padding: 10px 20px; margin: 10px 0; font-size: 16px;
            border: none; border-radius: 5px; background-color: #007BFF;
            color: white; cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        .result-block { margin-bottom: 30px; }
        .result-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 5px;
        }
        .copy-btn {
            background-color: #28a745; font-size: 14px; padding: 6px 12px;
        }
        .copy-btn:hover { background-color: #1e7e34; }
        .loading { font-style: italic; color: gray; }
    </style>
</head>
<body>

<h1>XEncode</h1>

<select id="modeSelector" onchange="encodePayload()">
  <option value="xss">XSS Mode</option>
  <option value="ssrf">SSRF Obfuscation Mode</option>
  <option value="ip">IP Obfuscation Mode</option>
</select>

<textarea id="payload" placeholder="Paste your payload here..." rows="5"></textarea>

<hr>

<div id="results"></div>

<div style="text-align: center;">
    <button type="button" onclick="copyAll()">Copy ALL Encodings</button>
</div>

<script>
    let timer = null;

    function encodePayload() {
        const payload = document.getElementById('payload').value;
        const mode = document.getElementById('modeSelector').value;

        if (mode === 'ip') {
            generateAdvancedIpEncodings(payload);
            return;
        }

        fetch('/encode', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'payload=' + encodeURIComponent(payload) + '&mode=' + encodeURIComponent(mode)
        })
        .then(response => response.json())
        .then(data => {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            for (const [name, value] of Object.entries(data)) {
                const block = document.createElement('div');
                block.className = 'result-block';

                const header = document.createElement('div');
                header.className = 'result-header';

                const title = document.createElement('h3');
                title.textContent = name;

                const copyBtn = document.createElement('button');
                copyBtn.textContent = 'Copy';
                copyBtn.className = 'copy-btn';
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(value).then(() => alert('Copied!'));
                };

                header.appendChild(title);
                header.appendChild(copyBtn);
                block.appendChild(header);

                if (name === 'EasterEgg') {
                    const pre = document.createElement('pre');
                    pre.className = 'encoded-text';
                    pre.innerHTML = value.replace(/\n/g, '<br>');
                    console.log(name, value);
                    block.appendChild(pre);
                } else {
                    const lines = value.split('\n');
                    lines.forEach(line => {
                        const pre = document.createElement('pre');
                        pre.className = 'encoded-text';
                        pre.textContent = line;
                        block.appendChild(pre);
                    });
                }
                resultsDiv.appendChild(block);
            }
        })
        .catch(() => {
            document.getElementById('results').innerHTML = '<p class="loading">Error encoding</p>';
        });
    }

    function generateAdvancedIpEncodings(ip) {
        const resultsDiv = document.getElementById("results");
        if (!ip || !/^\d+\.\d+\.\d+\.\d+$/.test(ip)) {
            resultsDiv.innerHTML = '<p class="loading">Invalid IP address</p>';
            return;
        }

        const [o1, o2, o3, o4] = ip.split('.').map(Number);
        const dword = (BigInt(o1) << 24n) | (BigInt(o2) << 16n) | (BigInt(o3) << 8n) | BigInt(o4);

        const hexv1 = `http://${[o1, o2, o3, o4].map(n => '0x' + n.toString(16)).join('.')}`;
        const hexv2 = `http://0x${[o1, o2, o3, o4].map(n => n.toString(16).padStart(2, '0')).join('')}`;
        const hexv3 = `http://0x${o1.toString(16)}.0x${[o2, o3, o4].map(n => n.toString(16).padStart(2, '0')).join('')}`;
        const hexv4 = `http://0x${o1.toString(16)}.0x${o2.toString(16)}.0x${(o3 << 8 | o4).toString(16).padStart(4, '0')}`;

        const octalv1 = `http://${[o1, o2, o3, o4].map(n => '0' + n.toString(8)).join('.')}`;
        const octalv2 = `http://${[o1, o2, o3, o4].map(n => n.toString(8).padStart(4, '0')).join('.')}`;
        const octalv3 = `http://0${dword.toString(8)}`;

        const percentv1 = `http://${[...ip].map(c => '%' + c.charCodeAt(0).toString(16)).join('')}`;

        const mixedv1 = `http://${o1}.0x${o2.toString(16)}.${'0'.repeat(3) + o3.toString(8)}.0x${o4.toString(16)}`;

        const unicode = 'http://' + ip.split('.').map(seg =>
            seg.split('').map(n => n !== '0' ? String.fromCodePoint(0x245F + parseInt(n)) : String.fromCodePoint(0x24EA)).join('')
        ).join('\uFF0E');

        const ipv6Mapped = `http://[::ffff:${ip}]`;

        const variants = {
            "Dotted Decimal": `http://${ip}`,
            "IPv6-mapped IPv4": ipv6Mapped,
            "Class B": `http://${o1}.${o2}.${o3 * 256 + o4}`,
            "Class A": `http://${o1}.${o2 * 256 ** 2 + o3 * 256 + o4}`,
            "DWORD": `http://${dword}`,
            "Hex (Dotted)": hexv1,
            "Hex (Single)": hexv2,
            "Hex (Hybrid1)": hexv3,
            "Hex (Hybrid2)": hexv4,
            "Dotted Octal": octalv1,
            "Padded Octal": octalv2,
            "Packed Octal": octalv3,
            "Percent-Encoded": percentv1,
            "Mixed Encoding": mixedv1,
            "Unicode (Circled)": unicode
        };

        let html = '';
        for (const [name, value] of Object.entries(variants)) {
            html += `
            <div class="result-block">
                <div class="result-header">
                <h3>${name}:</h3>
                <button type="button" class="copy-btn" onclick="navigator.clipboard.writeText('${value}')">Copy</button>
                </div>
                <pre class="encoded-text">${value}</pre>
            </div>
            `;
        }
        resultsDiv.innerHTML = html;
    }

    document.addEventListener('DOMContentLoaded', function() {
        const textarea = document.getElementById('payload');
        textarea.addEventListener('input', function() {
            clearTimeout(timer);
            timer = setTimeout(encodePayload, 300);
        });
        encodePayload();
    });

    function copyAll() {
        const elements = document.querySelectorAll('.encoded-text');
        let combined = '';
        elements.forEach(el => combined += el.innerText + '\n');
        navigator.clipboard.writeText(combined).then(() => alert('All Encoded Results Copied!'));
    }
</script>

</body>
</html>
